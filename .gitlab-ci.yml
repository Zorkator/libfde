stages:
    - build
    - test

.gitlab.org:
    tags: ["gitlab-org-docker"]

.build.wheel.linux:
    stage: build
    variables:
        BUILD_DIR   : .build
        BUILD_CFG   : Debug
        CONFIG_FLAGS: -DCMAKE_BUILD_TYPE=${BUILD_CFG} -DBUILD_TESTING=1 -DCMAKE_Fortran_FLAGS=--coverage -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage
        FDEPATH     : ${BUILD_DIR}/package/${BUILD_CFG}/bin
    script:
        - mkdir -p coverage
        - cmake -B ${BUILD_DIR} ${CONFIG_FLAGS}
        - cmake --build ${BUILD_DIR} --config ${BUILD_CFG} --parallel
        - pushd ${BUILD_DIR}
        - - ctest --output-on-failure --build-config ${BUILD_CFG}
        - - gcovr -r .. src libfortres
        - - gcovr -r .. src libfortres --xml=../coverage.xml --html-details=../coverage/coverage.html
        - popd
        - python setup.py bdist_wheel
    coverage: '/^TOTAL.*\s+(\d+\%)$/'
    artifacts:
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage.xml
        paths:
            - coverage/
            - dist/

.test.wheel.linux:
    stage: test
    script:
        - python -m pip install dist/*.whl
        - python test/test_wheel_setup.py



#---------------
# fedora:42
#---

build.wheel.fedora.42:
    extends: [.build.wheel.linux, .gitlab.org]
    image  : fedora:42
    before_script:
        - dnf update -y
        - dnf install -y g++ gcc-gfortran cmake gcovr python3-pip
        - pip install setuptools wheel #auditwheel patchelf
    script:
        - !reference [.build.wheel.linux, script]
        #- mv dist .dist
        #- auditwheel repair .dist/fde-*.whl -w dist #< patchelf seems broken, yields SEGFAULT on loading patched libs :-(

test.wheel.fedora.42:
    extends: [.test.wheel.linux, .gitlab.org]
    image  : fedora:42
    before_script:
        - dnf update -y
        - dnf install -y python3-pip gcc-gfortran #< need gfortran, since wheel has no libgfortran.so :-(
    needs:
        - job: build.wheel.fedora.42
          artifacts: true

#---------------
# debian:11
#---

build.wheel.debian.11:
    extends: [.build.wheel.linux, .gitlab.org]
    image  : debian:11
    before_script:
        - apt update
        - apt install -y g++ gfortran cmake gcovr python3-pip
        - python() { command python3 "$@"; }
        - pip install setuptools wheel auditwheel patchelf
    script:
        - !reference [.build.wheel.linux, script]
        - mv dist .dist
        - auditwheel repair .dist/fde-*.whl -w dist

test.wheel.debian.11:
    extends: [.test.wheel.linux, .gitlab.org]
    image  : debian:11
    before_script:
        - apt update
        - apt install -y python3-pip #gfortran #< need gfortran, since wheel has no libgfortran.so :-(
        - python() { command python3 "$@"; }
    needs:
        - job: build.wheel.debian.11
          artifacts: true

