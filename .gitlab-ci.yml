
include:
    - project: grs/gramovis/ci-tools
      ref:     main
      file:    [develop.yaml, tools.yaml, platform.yaml]

variables:
    BUILD_DIR: .build


#----------------
.build.core:
#----------------
    extends: [.cit_build_job]
    script:
        - cmake -B ${BUILD_DIR} "-DCMAKE_BUILD_TYPE=${BUILD_CONFIG}" -DBUILD_PARALLEL=1 -DBUILD_TESTING=1
        - cmake --build ${BUILD_DIR} --config ${BUILD_CONFIG} --parallel ${NUMBER_OF_PROCESSORS}
        - pushd ${BUILD_DIR}
        - - ctest --output-on-failure --build-config ${BUILD_CONFIG}
        - popd
    artifacts:
        when: always
        paths:
            - ${BUILD_DIR}/package

#----------------
.build.wheel:
#----------------
    extends: [.cit_build_job]
    variables:
        FDEPATH: ${BUILD_DIR}/package/${BUILD_CONFIG}/bin
    script:
        - python -m pip wheel -w dist --find-links dist .
        - auditwheel ${FDEPATH} repair dist/fde-*.whl -w .dist
        - rm dist/fde-*.whl  #< delete incomplete wheel
        - cp -r .dist/* dist #< before copying repaired one into dist
        - mv dist "${PACKAGE_DIR}.${PLATFORM_NAME}"

#----------------
.test.wheel:
#----------------
    extends: [.cit_test_job]
    script:
        - pip install --find-links=${PACKAGE_DIR}.${PLATFORM_NAME} fde pytest
        - cd test
        - - pytest -s --log-cli-level=DEBUG test_wheel_setup.py



#---------------
# debian:11
#---

core.debian:
    extends: [.build.core, .image.debian.compiler:2025]

wheel.debian:
    extends: [.build.wheel, .image.debian.compiler:2025]
    needs:   [core.debian]
    before_script:
        - !reference [.debian, before_script]
        - !reference [.tools.debian, install, python.auditwheel]

test.debian:
    extends: [.test.wheel, .image.debian.core:2025]
    needs:   [wheel.debian]
    before_script:
        - !reference [.debian, before_script]
        - !reference [.tools.linux, install, python.venv]


#---------------
# windows
#---

core.windows:
    extends: [.build.core, .image.windows.compiler:2025]

wheel.windows:
    extends: [.build.wheel, .image.windows.compiler:2025]
    needs:   [core.windows]
    before_script:
        - !reference [.windows, before_script]
        - !reference [.tools.windows, install, python.auditwheel]

test.windows:
    extends: [.test.wheel, .image.windows.core:2025]
    needs:   [wheel.windows]
    before_script:
        - !reference [.windows, before_script]
        - !reference [.tools.windows, install, python.venv]


#---------------
# external
#---

#-------------------------
test.athlet-controller:
#-------------------------
    stage: test
    needs: [wheel.debian, wheel.windows]
    trigger:
        project: grs/gramovis/athlet-controller
        branch: master


#-----------------------
pack:
#-----------------------
    extends: [.cit_pack_job]
    needs:   [test.debian, test.windows, wheel.debian, wheel.windows]
    script:
        # pack packages zipped with its dependencies...
        - !reference [.cit_pack_job, script]
        # ...  and simply the fde-*.whl files for all platforms.
        - cp -n ${PACKAGE_DIR}.*/fde-*.whl ${PACKAGE_DIR}
    variables:
        PACKED_PLATFORM_NAMES: debian windows

#-----------------------
upload:
#-----------------------
    extends: .cit_upload
    needs:   [pack]

#-----------------------
publish:
#-----------------------
    extends: .cit_publish
    needs:   [upload]
