
include:
    - project: grs/gramovis/ci-tools
      ref:     main
      file:    [develop.yaml, tools.yaml, platform.yaml]

variables:
    BUILD_DIR: .build


#----------------
.build.core:
#----------------
    extends: [.cit_build_job]
    script:
        - cmake -B ${BUILD_DIR} "-DCMAKE_BUILD_TYPE=${BUILD_CONFIG}" -DBUILD_PARALLEL=1 -DBUILD_TESTING=1
        - cmake --build ${BUILD_DIR} --config ${BUILD_CONFIG} --parallel ${NUMBER_OF_PROCESSORS}
        - pushd ${BUILD_DIR}
        - - ctest --output-on-failure --build-config ${BUILD_CONFIG}
        - popd
    artifacts:
        when: always
        paths:
            - ${BUILD_DIR}/package

#----------------
.build.wheel:
#----------------
    extends: [.cit_build_job]
    variables:
        FDEPATH: ${BUILD_DIR}/package/${BUILD_CONFIG}/bin
    script:
        - python -m pip wheel -w dist --find-links dist .
        - auditwheel ${FDEPATH} repair dist/fde-*.whl -w .dist
        - cit.rcopy .dist/* dist
    artifacts:
        paths:
            - dist

#----------------
.test.wheel:
#----------------
    extends: [.cit_test_job]
    script:
        - pip install --find-links=dist fde
        - cd test
        - python test_wheel_setup.py


#---------------
# debian:11
#---

core.debian:
    extends: [.build.core, .debian, .image.debian.compiler:2025]

wheel.debian:
    extends: [.build.wheel, .debian, .image.debian.compiler:2025]
    needs:
        - job: core.debian
          artifacts: true
    before_script:
        - !reference [.debian, before_script]
        - !reference [.tools.debian, install, python.auditwheel]

test.debian:
    extends: [.test.wheel, .debian, .image.debian.core:2025]
    needs:
        - job: wheel.debian
          artifacts: true
    before_script:
        - !reference [.debian, before_script]
        - !reference [.tools.linux, install, python.venv]


#---------------
# windows
#---

core.windows:
    extends: [.build.core, .windows, .image.windows.compiler:2025]

wheel.windows:
    extends: [.build.wheel, .windows, .image.windows.compiler:2025]
    needs:
        - job: core.windows
          artifacts: true
    before_script:
        - !reference [.windows, before_script]
        - !reference [.tools.windows, install, python.auditwheel]

test.windows:
    extends: [.test.wheel, .windows, .image.windows.core:2025]
    needs:
        - job: wheel.windows
          artifacts: true
    before_script:
        - !reference [.windows, before_script]
        - !reference [.tools.windows, install, python.venv]


#-----------------------
upload:
#-----------------------
    extends: .cit_upload
    needs:
        - job: test.debian
        - job: test.windows
        #
        - job: wheel.debian
          artifacts: true
        - job: wheel.windows
          artifacts: true
    variables:
        FILE_PATTERN: "*.whl"


#-----------------------
publish:
#-----------------------
    extends: .cit_publish
    needs:
        - job: upload
          artifacts: true
