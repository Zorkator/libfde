stages:
    - build
    - test

variables:
    BUILD_DIR   : .build
    BUILD_CONFIG:
        value      : Release
        options    : [Debug, Release]
        description: build configuration

#----------------
.build.core:
#----------------
    stage: build
    variables:
        CONFIG_FLAGS: -DCMAKE_BUILD_TYPE=${BUILD_CONFIG} -DBUILD_TESTING=1 -DBUILD_PARALLEL=1 -DCMAKE_Fortran_FLAGS=--coverage -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage
    script:
        - mkdir -p coverage
        - cmake -B ${BUILD_DIR} ${CONFIG_FLAGS}
        - cmake --build ${BUILD_DIR} --config ${BUILD_CONFIG} --parallel ${NUMBER_OF_PROCESSORS}
        - pushd ${BUILD_DIR}
        - - ctest --output-on-failure --build-config ${BUILD_CONFIG}
        - - gcovr -r .. src libfortres
        - - gcovr -r .. src libfortres --xml=../coverage.xml --html-details=../coverage/coverage.html
        - popd
    coverage: '/^TOTAL.*\s+(\d+\%)$/'
    artifacts:
        when   : always
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage.xml
        paths:
            - ${BUILD_DIR}/package
            - coverage/


#----------------
.build.wheel:
#----------------
    stage: build
    variables:
        FDEPATH: ${BUILD_DIR}/package/${BUILD_CONFIG}/bin
    script:
        - python setup.py bdist_wheel --dist-dir=.dist
        - auditwheel repair .dist/fde-*.whl -w dist
    artifacts:
        paths:
            - dist/fde-*.whl


#----------------
.test.wheel:
#----------------
    stage: test
    script:
        - pip install --find-links=dist fde
        - cd test
        - python test_wheel_setup.py



include: [.gitlab-linux.yml]
.gitlab.org:
    tags: ["gitlab-org-docker"]

#---------------
# debian:11
#---

core.debian.11:
    extends: [.build.core, .debian.11, .gitlab.org]
    before_script:
        - !reference [.debian.11, before_script]
        - apt install -y g++ gfortran cmake gcovr

wheel.debian.11:
    extends: [.build.wheel, .debian.11, .gitlab.org]
    needs:
        - job: core.debian.11
          artifacts: true
    before_script:
        - !reference [.debian.11, before_script]
        - apt install -y gfortran
        - pip install setuptools wheel auditwheel patchelf

test.debian.11:
    extends: [.test.wheel, .debian.11, .gitlab.org]
    needs:
        - job: wheel.debian.11
          artifacts: true


#---------------
# fedora:42
#---

core.fedora.42:
    extends: [.build.core, .fedora.42, .gitlab.org]
    before_script:
        - !reference [.fedora.42, before_script]
        - dnf install -y g++ gcc-gfortran cmake gcovr

wheel.fedora.42:
    extends: [.build.wheel, .fedora.42, .gitlab.org]
    needs:
        - job: core.fedora.42
          artifacts: true
    before_script:
        - !reference [.fedora.42, before_script]
        - dnf install -y gcc-gfortran
        - pip install setuptools wheel auditwheel patchelf
        # FIXME: disable auditwheel, since patchelf seems broken: loading patched libs yields SEGFAULT :-(
        - auditwheel() { mv .dist dist; } #< just rename outdir

test.fedora.42:
    extends: [.test.wheel, .fedora.42, .gitlab.org]
    needs:
        - job: wheel.fedora.42
          artifacts: true
    before_script:
        - !reference [.fedora.42, before_script]
        - dnf install -y gcc-gfortran #< need gfortran, since wheel has no libgfortran.so :-(
