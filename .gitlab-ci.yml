
include:
    - project: $CI_PROJECT_ROOT_NAMESPACE/ci-tools
      ref    : $CI_SERVER_FQDN
      file:    [develop.yaml]
      rules:
          - if: $CI_SERVER_FQDN == "gitlab.com"
    #
    - project: $CI_PROJECT_ROOT_NAMESPACE/gramovis/ci-tools
      ref    : $CI_SERVER_FQDN
      file:    [develop.yaml]
      rules:
          - if: $CI_SERVER_FQDN != "gitlab.com"

variables:
    BUILD_DIR: .build


#----------------
.build.core:
#----------------
    extends: [.cit_build_job]
    script:
        - mkdir -p coverage
        - cmake -B ${BUILD_DIR} "-DCMAKE_BUILD_TYPE=${BUILD_CONFIG}" -DBUILD_TESTING=1 -DBUILD_PARALLEL=1 -DCMAKE_Fortran_FLAGS=--coverage -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage
        - cmake --build ${BUILD_DIR} --config ${BUILD_CONFIG} --parallel ${NUMBER_OF_PROCESSORS}
        - pushd ${BUILD_DIR}
        - - ctest --output-on-failure --build-config ${BUILD_CONFIG}
        - - gcovr -r .. src libfortres
        - - gcovr -r .. src libfortres --xml=../coverage.xml --html-details=../coverage/coverage.html
        - popd
    coverage: '/^TOTAL.*\s+(\d+\%)$/'
    artifacts:
        when   : always
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage.xml
        paths:
            - ${BUILD_DIR}/package
            - coverage/

#----------------
.build.wheel:
#----------------
    extends: [.cit_build_job, .cit_referenced]
    variables:
        FDEPATH: ${BUILD_DIR}/package/${BUILD_CONFIG}/bin
    script:
        - !reference [.cit_referenced, script]
        - python -m pip wheel -w dist .
        - auditwheel ${FDEPATH} repair dist/fde-*.whl -w .dist
        - rm dist/fde-*.whl  #< delete incomplete wheel
        - cp -r .dist/* dist #< before copying repaired one into dist
        - mv dist "${PACKAGE_DIR}.${PLATFORM_NAME}"

#----------------
.test.wheel:
#----------------
    extends: [.cit_test_job]
    script:
        - pip install --find-links=${PACKAGE_DIR}.${PLATFORM_NAME} fde pytest
        - cd test #           . o O (avoid including fde-module from source directories!)
        - - pytest --rootdir=. -s --log-cli-level=DEBUG test_0_basic.py
    variables:
        PYTHON_VERSION: 3.11


#---------------
# debian:11
#---

core.debian:11:
    extends: [.build.core, .runner.debian:11]
    before_script:
        - !reference [.debian:11, before_script]
        - apt install -y g++ gfortran cmake gcovr 1> /dev/null

wheel.debian:11:
    extends: [.build.wheel, .runner.debian:11]
    needs:   [core.debian:11]
    before_script:
        - !reference [.debian:11, before_script]
        - apt install -y gfortran 1> /dev/null
        - pip install setuptools wheel auditwheel patchelf

test.debian:11:
    extends: [.test.wheel, .runner.debian:11]
    needs:   [wheel.debian:11]



#-----------------------
pack:
#-----------------------
    extends: [.cit_pack_job]
    needs:   [test.debian:11, wheel.debian:11]
    script:
        # pack packages zipped with its dependencies...
        - !reference [.cit_pack_job, script]
        # ...  and simply the fde-*.whl files for all platforms.
        - cp -n ${PACKAGE_DIR}.*/fde-*.whl ${PACKAGE_DIR}
    variables:
        PACKED_PLATFORM_NAMES: debian

#-----------------------
upload:
#-----------------------
    extends: .cit_upload
    needs:   [pack]

#-----------------------
publish:
#-----------------------
    extends: .cit_publish
    needs:   [upload]
