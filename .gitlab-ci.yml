
include:
    - project: $CI_PROJECT_ROOT_NAMESPACE/ci-tools
      ref    : $CI_SERVER_FQDN/main
      file:    [develop.yaml]
      rules:
          - if: $CI_SERVER_FQDN == "gitlab.com"
    #
    - project: $CI_PROJECT_ROOT_NAMESPACE/gramovis/ci-tools
      ref    : $CI_SERVER_FQDN/main
      file:    [develop.yaml]
      rules:
          - if: $CI_SERVER_FQDN != "gitlab.com"

variables:
    WHEEL_BASENAME: fde
    CIT_DEBUG: true

#----------------
.build.core:
#----------------
    extends: [.cit_build.cmake]
    variables:
        CMAKE_PKGBIN_DIR_VAR: FDEPATH

#----------------
.build.core.cov:
#----------------
    extends: [.build.core]
    variables:
        CMAKE_EXTRA_FLAGS: -DBUILD_TESTING=1 -DCMAKE_Fortran_FLAGS=--coverage -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage
    script:
        - !reference [.build.core, script]
        - mkdir -p coverage
        - pushd ${CMAKE_BUILD_DIR}
        - - gcovr -r .. src libfortres
        - - gcovr -r .. src libfortres --xml=../coverage.xml --html-details=../coverage/coverage.html
        - popd
    coverage: '/^TOTAL.*\s+(\d+\%)$/'
    artifacts:
        when: always
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage.xml
        paths:
            - ${CMAKE_BUILD_DIR}/package
            - coverage/

#----------------
.build.wheel:
#----------------
    extends: [.cit_build.wheel]
    variables:
        AUDITWHEEL_LIBSDIR: ${FDEPATH}

#----------------
.test.wheel:
#----------------
    extends: [.cit_test.wheel]
    variables: #                 . o O (avoid including fde-module from source directories!)
        PYTEST_OPTS: --rootdir=test -s --log-cli-level=DEBUG test/test_0_basic.py

#---------------
# debian:11
#---

core.debian:
    extends: [.build.core.cov, .runner.debian.compiler:11]

wheel.debian:
    extends: [.build.wheel, .runner.debian.compiler:11]
    needs:   [core.debian]
    before_script:
        - !reference [.runner.debian.compiler:11, before_script]
        - !reference [.tools.debian, setup, conda.python]
        - !reference [.tools.debian, install, python.auditwheel]

test.debian:
    extends: [.test.wheel, .runner.debian:11]
    needs:   [wheel.debian]
    before_script:
        - !reference [.runner.debian:11, before_script]
        - !reference [.tools.debian, setup, conda.python]


#---------------
# windows
#---

core.windows:
    extends: [.build.core, .runner.windows.compiler:2025]

wheel.windows:
    extends: [.build.wheel, .runner.windows.compiler:2025]
    needs:   [core.windows]
    before_script:
        - !reference [.runner.windows.compiler:2025, before_script]
        - !reference [.tools.windows, setup, conda.python]
        - !reference [.tools.windows, install, python.auditwheel]

test.windows:
    extends: [.test.wheel, .runner.windows.core:2025]
    needs:   [wheel.windows]
    before_script:
        - !reference [.runner.windows.core:2025, before_script]
        - !reference [.tools.windows, setup, conda.python]


#---------------
# all platforms
#---

wheel:
    extends: [.cit_build_job, .cit_job_collect]
    needs:   [wheel.debian, wheel.windows]


#-----------------------
pack:
#-----------------------
    extends: [.cit_pack_job]
    needs:   [test.debian, wheel.debian, test.windows, wheel.windows]

#-----------------------
upload:
#-----------------------
    extends: .cit_upload
    needs:   [pack]

#-----------------------
publish:
#-----------------------
    extends: .cit_publish
    needs:   [upload]
