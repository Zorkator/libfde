
include:
    - project: $CI_PROJECT_ROOT_NAMESPACE/ci-tools
      ref    : $CI_SERVER_FQDN
      file:    [develop.yaml]
      rules:
          - if: $CI_SERVER_FQDN == "gitlab.com"
    #
    - project: $CI_PROJECT_ROOT_NAMESPACE/gramovis/ci-tools
      ref    : $CI_SERVER_FQDN
      file:    [develop.yaml]
      rules:
          - if: $CI_SERVER_FQDN != "gitlab.com"


#----------------
.build.core:
#----------------
    stage: build
    variables:
        CONFIG_FLAGS: -DCMAKE_BUILD_TYPE=${BUILD_CONFIG} -DBUILD_TESTING=1 -DBUILD_PARALLEL=1 -DCMAKE_Fortran_FLAGS=--coverage -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage
    script:
        - mkdir -p coverage
        - cmake -B ${BUILD_DIR} ${CONFIG_FLAGS}
        - cmake --build ${BUILD_DIR} --config ${BUILD_CONFIG} --parallel ${NUMBER_OF_PROCESSORS}
        - pushd ${BUILD_DIR}
        - - ctest --output-on-failure --build-config ${BUILD_CONFIG}
        - - gcovr -r .. src libfortres
        - - gcovr -r .. src libfortres --xml=../coverage.xml --html-details=../coverage/coverage.html
        - popd
    coverage: '/^TOTAL.*\s+(\d+\%)$/'
    artifacts:
        when   : always
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage.xml
        paths:
            - ${BUILD_DIR}/package
            - coverage/


#----------------
.build.wheel:
#----------------
    stage: build
    variables:
        FDEPATH: ${BUILD_DIR}/package/${BUILD_CONFIG}/bin
    script:
        - python setup.py bdist_wheel --dist-dir=.dist
        - auditwheel repair .dist/fde-*.whl -w dist
    artifacts:
        paths:
            - dist/fde-*.whl


#----------------
.test.wheel:
#----------------
    stage: test
    script:
        - pip install --find-links=dist fde
        - cd test
        - python test_wheel_setup.py


#---------------
# debian:11
#---

core.debian.11:
    extends: [.build.core, .runner.debian:11]
    before_script:
        - !reference [.debian:11, before_script]
        - apt install -y g++ gfortran cmake gcovr

wheel.debian.11:
    extends: [.build.wheel, .runner.debian:11]
    needs:
        - job: core.debian.11
          artifacts: true
    before_script:
        - !reference [.debian:11, before_script]
        - apt install -y gfortran
        - pip install setuptools wheel auditwheel patchelf

test.debian.11:
    extends: [.test.wheel, .runner.debian:11]
    needs:
        - job: wheel.debian.11
          artifacts: true
